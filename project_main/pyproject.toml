[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saya-bot"
version = "0.0.1"
description = "QQ 群聊对话机器人（DeepSeek 核心）+ 多模态/工具编排路线对照实验平台"
requires-python = ">=3.11"
# M0/M1 刻意零依赖，只用标准库 —— 见 docs/02 路线图。
dependencies = []

[project.optional-dependencies]
# ⚠️ 机器人本体**运行时零依赖**（dependencies = []）—— 下面这些都只给**可选的附属进程**用。
# 各阶段按需装，不要一次全装。
#
# llm = 想把手写的那个标准库客户端换成官方 SDK 时才需要（见 services/llm.py 的文件头）
# cv  = 附属进程 `cv_mcp/server.py` 的依赖，和 `cv_mcp/requirements.txt` **必须一致**
#
# ⚠️ 这里曾经写着 `paddleocr`，而代码 import 的是 `rapidocr_onnxruntime` ——
#    照那份声明建环境，会白装几百 MB，且 OCR 永远 ModuleNotFoundError。
llm = ["openai>=1.40", "httpx>=0.27"]
cv = ["mcp>=1.0", "ultralytics>=8.3", "rapidocr_onnxruntime>=1.3", "pillow>=10"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
